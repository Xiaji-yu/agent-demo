[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-demo"
version = "1.0.1b1"
description = "模块化、可自托管的 QQ 智能体：NoneBot2 薄适配层 + 平台无关 agentcore"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Xiaji-yu", email = "variant305@gmail.com" }]
keywords = ["nonebot", "qq", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # 已知会带破坏性变化的大版本加范围，其余交给 uv.lock（M3）
    "nonebot2[fastapi]>=2.3.0,<3",
    "nonebot-adapter-onebot>=2.3.0,<3",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "apscheduler>=3.10",
    "trafilatura>=1.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.3.0",
    # MediaWiki 在线直查 skill（wiki_lookup）：wikitext 模板渲染转 Markdown；
    # 纯 Python 无 C 扩展。模块对缺失做了降级（正则剥模板），但降级会丢模板内容
    "wikitextparser>=0.11",
    # 群聊词云分词：纯 Python 无 C 扩展，缺失时降级内置 bigram（见
    # agentcore/groupstats/tokenize.py 的可选导入），不影响核心
    "jieba>=0.42.1",
    # QQ 语音 silk 编码。有 cp312 manylinux2014_x86_64 预编译 wheel，无需编译；
    # 缺失时点歌功能自动不注册（plugins/qq_agent_adapter/music_route.py），不影响核心
    "silk-python>=0.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    # CI 覆盖率门禁（M1）：阈值只在 CI 显式传 --cov-fail-under，本地单跑测试不受影响
    "pytest-cov>=5.0",
    # 与 .pre-commit-config.yaml 的 rev 对齐，避免本地钩子与 CI 的规则集漂移
    "ruff==0.9.6",
    # M2 类型门禁：版本 pin 与 ruff 同理——新版本会新增检查项，不 pin 会让
    # "本地绿、CI 红"随发布日期随机发生
    "pyright==1.1.414",
]

[tool.hatch.build.targets.wheel]
packages = ["agentcore", "plugins"]

[tool.nonebot]
plugins = []

[project.urls]
Homepage = "https://github.com/Xiaji-yu/agent-demo"
Repository = "https://github.com/Xiaji-yu/agent-demo.git"
Issues = "https://github.com/Xiaji-yu/agent-demo/issues"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# 精选稳定规则集：pycodestyle 错误 + pyflakes + import 排序 + pyupgrade + bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# 本项目的刻意选择：
# - BLE001：agent 代码普遍用 `except Exception` 做 fail-closed 防御，非误用
# - B010：运行时向 nonebot driver 注入属性（setattr(driver, "_agent_*")），无法用点号赋值
ignore = ["BLE001", "B010"]

[tool.pytest.ini_options]
# 性能/泄漏基线测试默认跳过（见 tests/test_perf.py），需显式 RUN_PERF=1 启用
markers = [
    "perf: 性能与内存泄漏基线（RUN_PERF=1 才运行）",
]

[tool.coverage.run]
source = ["agentcore"]
# 只排入口脚本；不整模块 exclude（会让薄模块永远"100%"，掩盖未覆盖代码）
omit = ["agentcore/**/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
