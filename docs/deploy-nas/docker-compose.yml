# agent-demo NAS 部署 compose（绿联 DX4600 / x86_64，对照 picoclaw 部署形态）
#
# 与仓库根目录 docker-compose.yml 的差别：
#   ① 无 build 段——镜像由 GitHub Actions（.github/workflows/docker-publish.yml）
#      构建推送 ghcr.io/daiyimo/agent-demo:latest，NAS 只拉不建；
#   ② AGENT_DB_PORT 默认 55432——NAS 的 127.0.0.1:5432 已被 appstore PG 实例占用；
#   ③ 显式 container_name——docker ps 可读，对齐 picoclaw 的部署习惯。
#
# 首次部署先跑一条 init（生成 config/agent.json、config.yaml、data/，不用自己找模板
# 改名，也不用 mkdir 14 个目录）：
#   docker run --rm -v "$PWD:/out" ghcr.io/daiyimo/agent-demo:latest init /out
# 然后按提示编辑 config/agent.json 填密钥，再 docker compose up -d db bot。
# 详细说明见 ../deploy-nas.md；面向新手的极简 JSON 与 NapCat 配置参考见
# ../config-quickstart.md。
#
# 用法：把本文件放到项目目录（建议 /volume2/docker/agent-demo/），
# config/ 与 data/ 由 init 生成。

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-demo-db
    environment:
      POSTGRES_DB: ${AGENT_DB_NAME:-qqagent}
      # 凭据从 .env 注入；compose 组装的 DATABASE_URL 不做 URL 编码，
      # 密码请用纯字母数字（避开 @ 和 $，$ 要写 $$）
      POSTGRES_USER: ${POSTGRES_USER:-qqagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qqagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 仍只绑回环：DB 不对局域网暴露；55432 只为「从宿主连进去查数据」开口子
    ports:
      - "127.0.0.1:${AGENT_DB_PORT:-55432}:5432"
    # PG 并行查询的共享内存：docker 默认 shm 只有 64MB，复杂查询会
    # "No space left on device"（不是磁盘满，是 /dev/shm 满）
    shm_size: "256mb"
    # stdout 不轮转会在根盘无限增长（json-file 无默认上限）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # bot 的 depends_on 要这个判活
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-qqagent} -d ${AGENT_DB_NAME:-qqagent}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    image: ghcr.io/daiyimo/agent-demo:latest
    container_name: agent-demo-bot
    # tini 信号转发：优雅停机（scheduler → debounce flush → store.aclose，
    # 顺序固定不可反）挂在 SIGTERM 上；没有 init 时 docker stop 直接杀进程
    init: true
    # 宽限期 ≥ AGENT_SHUTDOWN_FLUSH_TIMEOUT（默认 30s）：flush 要过全局 LLM
    # 闸门，无界等待会被 SIGKILL 反而全丢
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # JSON 部署不需要 .env——配置走挂进来的 config/agent.json。
    # 只有仍用 .env 的老部署才取消下面两行注释（env_file 要求文件存在，缺了直接报错）；
    # 老部署的 PORT 也被下面 environment 盖掉，改端口同样只改 AGENT_BOT_PORT：
    # env_file:
    #   - .env
    environment:
      # 覆盖配置里指向 127.0.0.1 的 DATABASE_URL——容器网络里要用服务名 db
      DATABASE_URL: postgresql://${POSTGRES_USER:-qqagent}:${POSTGRES_PASSWORD:-qqagent}@db:5432/${AGENT_DB_NAME:-qqagent}
      # 系统时区（业务时区另配 AGENT_SCHEDULER_TZ，在 config/agent.json）
      TZ: ${TZ:-Asia/Shanghai}
      # web 受控写面的落点：挂载进来的那一份（config_write 写、bot.py 读，两边同源）
      AGENT_ENV_FILE: /app/config/agent.env
      # 容器内监听口，与下面映射的容器侧同源：compose 插值读不到容器里的
      # config/agent.json，所以端口只有一个旋钮 AGENT_BOT_PORT（改它即三处同时变）
      PORT: ${AGENT_BOT_PORT:-8080}
    # 反向 WS 服务端 + web 总览共用这一个端口；宿主口 AGENT_BOT_PORT，容器口同值
    # （见上面 environment 的 PORT）——改端口只改 AGENT_BOT_PORT，不会只改一边
    ports:
      - "${AGENT_BOT_BIND:-0.0.0.0}:${AGENT_BOT_PORT:-8080}:${AGENT_BOT_PORT:-8080}"
    # config/ 与 config.yaml 是 web 受控写面的落点，必须挂进来；data/ 只挂运行期
    # 子目录，绝不整卷挂 /app/data——那会遮掉镜像里的 data/fonts（文字卡片渲染
    # 静默失败）；state/ 收容 7 个易失状态文件
    # （llm-providers/2fa-secret/nudge 等，init 生成的 agent.json 已带这 7 个重定向）；
    # mirror/ 是 AGENT_BACKUP_MIRROR_DIR 默认落点；
    # ssh/ 让 ssh_run 的 known_hosts 跨容器重建存活
    volumes:
      # 整个 config/ 目录挂载（不是 ./.env:/app/.env 这种单文件挂载）：里面放
      # agent.json（主配置）与 agent.env（web 写面落点）。**刻意用目录**——源路径
      # 不存在时 Docker 会自动建一个目录，再把目录绑到镜像里的文件上，报一句指不到
      # 病因的 `not a directory`（2026-10-28 在绿联 NAS 上连踩两次，dotfile 尤其
      # 建不住）。目录挂载在源不存在时自动建目录，那正是它想要的行为。
      # 仍要 .env 的老部署取消下面这行注释：
      #   - ./.env:/app/.env
      - ./config:/app/config
      - ./config.yaml:/app/config.yaml
      - ${AGENT_DATA_DIR:-./data}/logs:/app/data/logs
      - ${AGENT_DATA_DIR:-./data}/archive:/app/data/archive
      - ${AGENT_DATA_DIR:-./data}/backups:/app/data/backups
      - ${AGENT_DATA_DIR:-./data}/budget:/app/data/budget
      - ${AGENT_DATA_DIR:-./data}/workspace:/app/data/workspace
      - ${AGENT_DATA_DIR:-./data}/cache:/app/data/cache
      - ${AGENT_DATA_DIR:-./data}/sessions:/app/data/sessions
      - ${AGENT_DATA_DIR:-./data}/privacy:/app/data/privacy
      - ${AGENT_DATA_DIR:-./data}/skills:/app/data/skills
      - ${AGENT_DATA_DIR:-./data}/kb_samples:/app/data/kb_samples
      - ${AGENT_DATA_DIR:-./data}/state:/app/data/state
      - ${AGENT_DATA_DIR:-./data}/mirror:/app/data/mirror
      - ${AGENT_DATA_DIR:-./data}/ssh:/app/data/ssh
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # PG 数据落在 Docker RootDir（你的 NAS 是 /volume1/@docker，3.6T 存储池）；
  # 每日备份由 bot 用镜像内 pg_dump 落 data/backups + data/mirror，pgdata 不占项目目录
  pgdata:
