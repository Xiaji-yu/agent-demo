name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # M（REVIEW-a604023..679c9b3）：PgMemoryStore 契约测试此前在 CI 永久跳过
    # （21 条 TEST_DATABASE_URL 门控、CI 无 PG 服务）→ 这里起一个 pgvector 服务，
    # 让双实现契约（list_facts 排序 / kb_add_chunks 去重 / messages_after 作用域等）
    # 真正被执行。注意：本机无法验证 GitHub runner 上的实际表现，首次推送后需看 CI 结果。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qqagent
          POSTGRES_PASSWORD: qqagent
          POSTGRES_DB: qqagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qqagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://qqagent:qqagent@127.0.0.1:5432/qqagent_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # M1（REVIEW-6ec3f7c..a36ea1d）：点歌语音的 silk 编码依赖 ffmpeg，而
      # ubuntu-latest 的镜像清单里**没有** ffmpeg（实测 image 20260907.300.1 的
      # 包表 f 段为 fakeroot/file/findutils/flex/fonts-noto-color-emoji/ftp）。
      # 不装它 → silk_available() 恒为 False → tests/test_music.py 的 A5 用例
      # （head/往返/体积比/采样率）在 CI **静默跳过**，而 music_route 的两条
      # 注册/探测用例直接失败（本地有 ffmpeg 才绿）。
      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check agentcore plugins tests bot.py scripts

      - name: Format check
        run: ruff format --check agentcore plugins tests bot.py scripts

      - name: Test
        run: pytest -q
