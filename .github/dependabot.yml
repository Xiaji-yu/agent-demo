version: 2
updates:
  # uv 生态同时覆盖 pyproject.toml 与 uv.lock（M3）。每月一次，minor/patch
  # 合成一个 PR 减少噪音；major 单独提，必须人看破坏性变更（如 nonebot 3.x）。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
