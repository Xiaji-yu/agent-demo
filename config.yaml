agent:
  max_iterations: 8
  # DATABASE_URL 一律从 .env 读取（原 database.url_env 间接层从未被实现，已删）
  # M4 长期记忆
  extract_facts: true        # 每轮对话后从用户消息抽取事实存入记忆
  memory_facts_top_k: 5      # 每次组装 prompt 召回的相关事实条数
  memory_facts_threshold: 0.15  # 召回相似度下限（本地 hash embedding 建议 0.1~0.2）
  # A2 历史裁剪 + 滚动摘要：单 turn 历史输入钉在预算内，更早的压缩成摘要进 system prompt
  summary_enabled: true        # 超预算才激活；false = 与旧版行为完全一致（永不裁剪/摘要）
  history_token_budget: 3000   # 历史 token 预算（保守估算：CJK≈1/字，ASCII≈1/4 字符）
  summary_max_tokens: 400      # 摘要 LLM 调用的输出上限
  summary_fetch_limit: 200     # 取数窗口：最近 N 条内做预算裁剪，更早的靠摘要水位补漏
  summary_max_chars: 2000      # 注入 prompt 的摘要硬截断（防模型不守字数）

# 记录保全：聊天记录 JSONL 归档（DB 之外，滚动保留）+ 每日数据库备份
archive:
  dir: data/archive        # 全量聊天记录（按天切分 messages-YYYY-MM-DD.jsonl）
  keep_days: 7             # 滚动保留天数，超期文件在每日任务里删除

backup:
  dir: data/backups        # 数据库备份产物（pg_dump .sql.gz 或 JSONL .jsonl.gz）
  keep: 7                  # 保留最近 N 份
  cron: "30 3 * * *"       # 每日备份时间（同时触发归档轮转）
  mirror_dir: ""           # 异地镜像目录（如挂载的 NAS/另一块盘）；为空则不做镜像

# M5 公共知识库（全局共享、入库前脱敏）
rag:
  enabled: true            # false 则既不检索也不蒸馏（写入类命令同时被拒绝）
  top_k: 4                 # 每次注入 prompt 的检索结果条数
  threshold: 0.3           # 相似度下限（低于该值不注入）
  chunk_chars: 600         # 摄取切块目标长度
  # 单来源块数上限：超出部分此前被静默丢弃（评审 H1）。大部头百科/剧情语料
  # 会切出 200~300 块，故这里显式放宽；仍保留上限以防单个文件灌爆知识库。
  # 运行时丢弃量会打印 WARNING 并计入脚本汇总。也可用 env 覆盖：
  # AGENT_KB_MAX_CHUNKS_PER_SOURCE
  max_chunks_per_source: 1000
  digest_cron: "0 3 * * *" # 每天 03:00 从记忆蒸馏（5 段 cron）
  digest_batch: 200        # 每次最多处理多少条新消息
  max_entries: 8           # 每次蒸馏最多沉淀多少条知识
  min_chars: 200           # 新内容少于该长度则本次跳过（水位线不推进）
  distill_max_tokens: 4096 # 蒸馏输出上限（推理型模型会把预算耗在思维链上，别给太小）
  # 蒸馏 prompt 长度上限（字符）：单条消息超过 per_message_cap 会被截断并留痕；
  # transcript 总长超过 total_cap 时停止收集，避免 prompt 过大。
  distill_per_message_cap: 1000
  distill_total_cap: 20000

# acl: 段已移除——历史上没有任何代码读取它（超级用户/群白名单实际由
# .env 的 SUPERUSERS / ALLOWED_GROUPS 驱动），保留只会误导部署者。

# M7 定时内容推送：到点按 prompt 用 LLM 生成正文，主动投递到群/私聊。
# 与「定时提醒」的分界：提醒文案确定（用户自己写），这里正文由模型生成、
# LLM 不可用/预算熔断时回退 template。全部 env 可覆盖（AGENT_PUSH_*）。
push:
  enabled: true              # AGENT_PUSH_ENABLED=0 整体关闭
  tick: 30                   # AGENT_PUSH_TICK 轮询间隔秒（最小 5）
  retry_delay: 300           # AGENT_PUSH_RETRY_DELAY 投递失败顺延基数（秒，指数退避）
  max_failures: 5            # AGENT_PUSH_MAX_FAILURES 连续失败这么多次就停用并私聊管理员
  max_retry_delay: 86400     # AGENT_PUSH_MAX_RETRY_DELAY 退避上限（秒）
  daily_cap_per_target: 1    # AGENT_PUSH_DAILY_CAP_PER_TARGET 每目标每日最多推送条数；0 = 不限
  max_chars: 500             # AGENT_PUSH_MAX_CHARS 推送正文长度上限（同时用作 LLM 输出上限）；0 = 不限
  jobs: []
  # 每个任务：name（稳定标识，改名前停用旧任务）/ cron（5 段）/ target（group:群号 或 private:QQ号）
  #          / prompt（生成要求，可省）/ template（兜底文案，与 prompt 至少留一个）
  # jobs:
  #   - name: 早安问候
  #     cron: "0 8 * * *"
  #     target: group:123456789
  #     prompt: 用一句话向群友们道早安，语气温暖自然，不超过 60 字，不要带表情符号堆砌。
  #     template: 大家早上好呀，新的一天开始啦～
  #
  # 群目标必须同时在 ALLOWED_GROUPS 白名单里（与主聊天同一套 ACL），否则任务会被
  # 停用并私聊管理员；/push list|off|run 可在 QQ 里查看与管理（仅管理员）。

skills:
  enabled: true
  default_permission: public
  permissions:
    # superusers 中包含 "*" 表示所有用户都是 superuser（全开）
    # 否则只对列出的 user_id 开放
    superusers: ["*"]
    groups: {}
    users: {}

