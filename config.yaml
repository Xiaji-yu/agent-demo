database:
  # 环境变量名；值为空时 agent-demo 会退化为内存存储（M0 可用）
  url_env: "DATABASE_URL"

agent:
  max_iterations: 8
  session_policy: per_user  # per_user | per_group | shared
  # M4 长期记忆
  extract_facts: true        # 每轮对话后从用户消息抽取事实存入记忆
  memory_facts_top_k: 5      # 每次组装 prompt 召回的相关事实条数
  memory_facts_threshold: 0.15  # 召回相似度下限（本地 hash embedding 建议 0.1~0.2）

acl:
  superusers: []  # 留空表示不限制超级用户
  groups:
    allow: []     # 留空表示私聊可用、群聊全部可用；填入群号白名单

skills:
  enabled: true
  default_permission: public
  permissions:
    # superusers 中包含 "*" 表示所有用户都是 superuser（全开）
    # 否则只对列出的 user_id 开放
    superusers: ["*"]
    groups: {}
    users: {}

tools:
  # 兼容旧配置，已迁移到 skills 系统
  enabled:
    - fetch_url
    - get_weather
    - calc
